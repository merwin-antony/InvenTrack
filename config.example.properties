# ===================================================================
# Inventory Management System - Database & Application Configuration
# ===================================================================
# Copy this file to 'config.properties' and update the values to match
# your local MySQL Workbench / MySQL Server setup.
# ===================================================================

db.url=jdbc:mysql://localhost:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# MySQL Database Credentials
# Change these to your actual MySQL username and password:
db.username=root
db.password=root

# Application Settings
# Product quantity threshold below which an item triggers a "Low Stock" alert
inventory.low_stock_threshold=5
